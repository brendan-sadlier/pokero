name-template: 'v$RESOLVED_VERSION 🎲'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🖥️ Frontend'
    labels:
      - 'frontend'
      - 'pages'
      - 'ui-components'
      - 'styling'
  - title: '⚙️ Backend'
    labels:
      - 'backend'
  - title: '🪝 Hooks & Utilities'
    labels:
      - 'hooks'
      - 'types'
  - title: '📖 Documentation'
    labels:
      - 'documentation'
  - title: '🔧 Build & Configuration'
    labels:
      - 'build'
      - 'config'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
  - title: '🧹 Maintenance'
    labels:
      - 'chore'
      - 'maintenance'
  - title: '🏛️ Legal'
    labels:
      - 'legal'

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
change-title-escapes: '\<*_`'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
      - 'frontend'
      - 'backend'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'documentation'
      - 'ui-components'
      - 'styling'
      - 'hooks'
      - 'types'
      - 'build'
      - 'config'
      - 'dependencies'
      - 'chore'
      - 'maintenance'
  default: patch

exclude-labels:
  - 'skip-changelog'
  - 'no-release'

autolabeler:
  - label: 'feature'
    branch:
      - '/^feature[/-].+/'
      - '/^feat[/-].+/'
  - label: 'bugfix'
    branch:
      - '/^bugfix[/-].+/'
      - '/^fix[/-].+/'
      - '/^hotfix[/-].+/'
  - label: 'chore'
    branch:
      - '/^chore[/-].+/'
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**'
  - label: 'frontend'
    files:
      - 'src/**'
  - label: 'backend'
    files:
      - 'party/**'
  - label: 'dependencies'
    files:
      - 'package.json'
      - 'package-lock.json'

template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  ---
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
